name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Gosuslugi - install deps
        working-directory: gosuslugi_app_only
        run: flutter pub get

      - name: Gosuslugi - generate icons
        working-directory: gosuslugi_app_only
        run: flutter pub run flutter_launcher_icons

      - name: Gosuslugi - build iOS
        working-directory: gosuslugi_app_only
        run: flutter build ios --release --no-codesign

      - name: Gosuslugi - package ipa
        working-directory: gosuslugi_app_only
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r gosuslugi-app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: gosuslugi-app-ipa
          path: gosuslugi_app_only/gosuslugi-app.ipa

      - name: MAX - install deps
        working-directory: max_app_only
        run: flutter pub get

      - name: MAX - generate icons
        working-directory: max_app_only
        run: flutter pub run flutter_launcher_icons

      - name: MAX - build iOS
        working-directory: max_app_only
        run: flutter build ios --release --no-codesign

      - name: MAX - package ipa
        working-directory: max_app_only
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r max-app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: max-app-ipa
          path: max_app_only/max-app.ipa

      - name: MESH - install deps
        working-directory: mesh_app_only
        run: flutter pub get

      - name: MESH - generate icons
        working-directory: mesh_app_only
        run: flutter pub run flutter_launcher_icons

      - name: MESH - build iOS
        working-directory: mesh_app_only
        run: flutter build ios --release --no-codesign

      - name: MESH - package ipa
        working-directory: mesh_app_only
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r mesh-app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: mesh-app-ipa
          path: mesh_app_only/mesh-app.ipa
